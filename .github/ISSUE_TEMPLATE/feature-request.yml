name: Feature request
description: Something Lanyard should do, or do differently.
labels: ["feature-request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What is slow, missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working, if you have an idea.
  - type: input
    id: version
    attributes:
      label: Lanyard version
      placeholder: "0.4.1"
